services:
  # --- PostgreSQL Database ---
  - type: postgresql
    name: jobpulse-db
    databaseName: jobpulse
    user: jobpulse
    plan: free
    ipAllowList: []

  # --- Backend (FastAPI) ---
  - type: web
    name: jobpulse-api
    runtime: image
    region: oregon
    plan: free
    dockerfilePath: ./ui/jobpulse-backend/jobpulse-backend/Dockerfile
    dockerContext: .
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:8000","https://jobpulse-frontend.onrender.com"]'
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: JOB_DATASET_PATH
        value: ./data/processed/jobpulse_cleaned.parquet

  # --- Frontend (React + nginx) ---
  - type: web
    name: jobpulse-frontend
    runtime: image
    region: oregon
    plan: free
    dockerfilePath: ./ui/jobpulse-unified-app2.0/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # After first deploy, set BACKEND_URL in the Render dashboard to:
      #   https://jobpulse-api.onrender.com
      # (The fromService reference below won't resolve to a URL — it must be
      #  overridden manually or set to the actual backend URL.)
      - key: BACKEND_URL
        value: https://jobpulse-api.onrender.com
