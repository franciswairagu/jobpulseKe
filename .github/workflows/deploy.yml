name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/jobpulse-unified-app2.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/jobpulse-unified-app2.0/package-lock.json

      - name: Check token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is missing or empty" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "VERCEL_TOKEN is set (length=${#VERCEL_TOKEN})" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN" > /tmp/vercel-out.txt 2>&1
          code=$?
          {
            echo "### Vercel deploy (exit $code)"
            echo '```'
            cat /tmp/vercel-out.txt
            echo '```'
            echo "project.json:"
            echo '```'
            cat .vercel/project.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
