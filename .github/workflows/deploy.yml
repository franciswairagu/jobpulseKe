name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/jobpulse-unified-app2.0/package-lock.json

      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S_VERCEL: ${{ secrets.VERCEL_TOKEN }}
        run: |
          yn() { if [ -n "$1" ]; then echo "Y(${#1})"; else echo "N"; fi; }
          DIAG="repo=$GITHUB_REPOSITORY ref=$GITHUB_REF sec[VERCEL_TOKEN=$(yn "$S_VERCEL")]"
          echo "$DIAG"
          echo "::error title=secret-diag::$DIAG"
          {
            echo "### Secret check"
            echo "$DIAG"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$S_VERCEL" ]; then
            echo "No Vercel token found"
            exit 1
          fi
          echo "VERCEL_TOKEN=$S_VERCEL" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ui/jobpulse-unified-app2.0
        run: npm ci

      - name: Build
        working-directory: ui/jobpulse-unified-app2.0
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: team_PdDMaalD8mdX7GviRZd37VUA
          VERCEL_PROJECT_ID: prj_pHFHkFHZKI0dCHnMHEMdWDH6aeyy
        run: |
          set +e
          npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN" > /tmp/vercel-out.txt 2>&1
          code=$?
          {
            echo "### Vercel deploy (exit $code)"
            echo '```'
            cat /tmp/vercel-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR=$(tail -c 1800 /tmp/vercel-out.txt | tr '\n' ' | ')
          echo "::error title=vercel-deploy(exit $code)::$ERR"
          exit $code
