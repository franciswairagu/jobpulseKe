services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - jobpulse_uploads:/app/data/uploads
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - .:/app
      - jobpulse_uploads:/app/data/uploads
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: jobpulse
      POSTGRES_DB: jobpulse
    ports:
      - "5432:5432"
    volumes:
      - jobpulse_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  jobpulse_pgdata:
  jobpulse_uploads:
